# Продакшен-стек: PostgreSQL + API + nginx (SPA).
#
# 1. Скопируйте docker/.env.prod.example → docker/.env (или .env рядом с compose) и задайте секреты.
# 2. docker compose -f docker-compose.prod.yml --env-file docker/.env up -d --build
# 3. Первая БД: docker compose -f docker-compose.prod.yml exec api sh -c "cd /app/apps/api && npx prisma db push"
# 4. Сид: docker compose -f docker-compose.prod.yml exec api sh -c "cd /app/apps/api && npx prisma db seed"
#
# Сайт: http://localhost:${HTTP_PORT:-8080}  (снаружи поставьте HTTPS reverse proxy).

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in env file}
      POSTGRES_DB: atlas_v1
    volumes:
      - atlas_prod_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_v1"]
      interval: 5s
      timeout: 5s
      retries: 5

  gost:
    # HTTP-прокси (RAPIDAPI_PROXY_URL) → локальный SOCKS5 для Telegram MTProto
    image: ginuerzh/gost:2.11.5
    restart: unless-stopped
    command: ["-L=socks5://:1080", "-F=${RAPIDAPI_PROXY_URL}"]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      gost:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://atlas:${POSTGRES_PASSWORD}@db:5432/atlas_v1?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in env file}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080/api/auth}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Atlas <onboarding@resend.dev>}
      HOST: 0.0.0.0
      PORT: 3001
      # Один origin с фронтом (браузер бьёт в /api на том же хосте) — можно оставить true
      CORS_ORIGIN: ${CORS_ORIGIN:-true}
      # ALL / * / пусто → весь CryptocurrencyList; иначе CSV whitelist
      TRADING_DAY_SYMBOLS: ${TRADING_DAY_SYMBOLS:-ALL}
      TRADING_DAY_CRON_DISABLED: ${TRADING_DAY_CRON_DISABLED:-false}
      # Node 20: global WebSocket нет; стрим Binance через пакет ws (или true = только REST/cron)
      BINANCE_WS_DISABLED: ${BINANCE_WS_DISABLED:-false}
      # Макрокалендарь (RapidAPI TradingEconomics) — для cron и ручного импорта
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      RAPIDAPI_KEY_SECONDARY: ${RAPIDAPI_KEY_SECONDARY:-}
      RAPIDAPI_HOST: ${RAPIDAPI_HOST:-economic-calendar-api-tradingeconomics.p.rapidapi.com}
      RAPIDAPI_PROXY_URL: ${RAPIDAPI_PROXY_URL:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      BONDS_YIELD_CRON_DISABLED: ${BONDS_YIELD_CRON_DISABLED:-false}
      # Telegram news + LLM daily index (23:00 MSK)
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION: ${TELEGRAM_SESSION:-}
      TELEGRAM_CHANNELS: ${TELEGRAM_CHANNELS:-}
      TELEGRAM_NEWS_SYNC_DISABLED: ${TELEGRAM_NEWS_SYNC_DISABLED:-false}
      TELEGRAM_NEWS_CATCHUP_MINUTES: ${TELEGRAM_NEWS_CATCHUP_MINUTES:-5}
      TELEGRAM_NEWS_RETENTION_DAYS: ${TELEGRAM_NEWS_RETENTION_DAYS:-0}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      TELEGRAM_CONNECT_TIMEOUT_MS: ${TELEGRAM_CONNECT_TIMEOUT_MS:-20000}
      TELEGRAM_PROXY_TYPE: ${TELEGRAM_PROXY_TYPE:-socks5}
      TELEGRAM_PROXY_HOST: ${TELEGRAM_PROXY_HOST:-gost}
      TELEGRAM_PROXY_PORT: ${TELEGRAM_PROXY_PORT:-1080}
      TELEGRAM_PROXY_USERNAME: ${TELEGRAM_PROXY_USERNAME:-}
      TELEGRAM_PROXY_PASSWORD: ${TELEGRAM_PROXY_PASSWORD:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://polza.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o}
      NEWS_WIDGET_LLM_DISABLED: ${NEWS_WIDGET_LLM_DISABLED:-false}
      NEWS_WIDGET_LLM_CRON_DISABLED: ${NEWS_WIDGET_LLM_CRON_DISABLED:-false}
      NEWS_FEEDBACK_OWNER_EMAIL: ${NEWS_FEEDBACK_OWNER_EMAIL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      NEWS_FEEDBACK_FEWSHOT_COUNT: ${NEWS_FEEDBACK_FEWSHOT_COUNT:-8}
      NEWS_FEEDBACK_MIN_SIMILARITY: ${NEWS_FEEDBACK_MIN_SIMILARITY:-0.75}
      NEWS_FEEDBACK_PRICE_HINT_WINDOW_HOURS: ${NEWS_FEEDBACK_PRICE_HINT_WINDOW_HOURS:-4}
    volumes:
      - atlas_api_data:/app/apps/api/data

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  atlas_prod_pg_data:
  atlas_api_data:
